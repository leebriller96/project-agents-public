# 업무 분류 (1단계 산출물). workspace/<project>/slices/slices.yaml
# 사람이 승인(approved: true)해야 2단계 이후가 진행된다.
approved: false
approved_by:
approved_at:

slices:
  - id: common-auth                  # 영문 소문자·하이픈. 패키지명/디렉토리명으로 쓰인다
    name: 인증/권한
    description: 로그인, 토큰 발급, 권한 검사
    module: user                     # 소유 모듈 — config project.modules 가 있으면 필수(그 목록 중 하나), 없으면 생략.
                                     # 공통 사용 행렬·계약이 모듈 공통/모듈별 복사를 판정하고, gate 가 변경 파일의 모듈 경로를 대조한다
    existing_code: []                # (brownfield) 이 slice 가 수정할 기존 TO-BE 경로 (target_dir 기준). 새로 만들지 않고 고치는 곳
    hold: false                      # true = 근거 부족으로 착수 보류. 승인·공통 계약 계산에는 포함되고 /stage2·/run 착수 대상에서만 빠진다
    hold_reason: ""                  # hold 사유 (예: 요구사항 근거 대기 — 근거 문서명)
    priority: 1                      # 낮을수록 먼저
    depends_on: []                   # 다른 slice id. 병렬 실행 판단에 쓰인다
    traits: [auth]                   # 검증 축을 결정하는 특성 (아래 표). 없으면 빈 배열
    entities: [User, Role]           # 주요 엔티티 (PROJECT_BRIEF 의 엔티티 목록과 일치)
    screens: [SCR-001 로그인]        # 화면 목록 (화면 ID + 이름)
    apis: ["POST /auth/login", "POST /auth/refresh"]
    requirements: [REQ-001, REQ-002] # 요구사항 ID (추적표에 쓰인다)
    sources:                         # 근거 문서 (문서명#절)
      - 요구사항정의서.docx#3.1
    asis:                            # mode=migration 일 때: AS-IS 매핑
      packages: [com.legacy.login]
      tables: [TB_USER, TB_ROLE]
      programs: [LoginAction.java]
      namespaces: [login]           # 이 slice 가 소유하는 SQL namespace (공통 사용 행렬·계약이 statement 소유를 판정)

  - id: order
    name: 주문
    description: 주문 생성·조회·취소
    priority: 2
    depends_on: [common-auth]
    traits: [transaction, counter]
    entities: [Order, OrderItem]
    screens: [SCR-010 주문목록, SCR-011 주문상세]
    apis: ["GET /orders", "POST /orders", "DELETE /orders/{id}"]
    requirements: [REQ-010, REQ-011]
    sources: []
    asis: {}

  # 큰 slice 의 unit 분할 예시 (필요할 때만 — tools/slice_units.py measure 가 분할 후보로 판정한 slice)
  # slice 는 계약·소유·검증의 단위로 남고, unit 은 에이전트 1회 실행의 단위다. 나누는 기준은 업무 프로세스의 상태 전이다.
  - id: claim
    name: 보험금 청구
    description: 청구 접수·심사·지급·조회
    priority: 3
    depends_on: [common-auth]
    traits: [transaction]
    entities: [Claim, ClaimPayment]
    screens: [SCR-201 청구접수, SCR-202 청구심사, SCR-203 지급처리, SCR-204 청구조회]
    apis: ["POST /claims", "POST /claims/{no}/review", "POST /claims/{no}/payment", "GET /claims"]
    requirements: [REQ-201, REQ-202, REQ-203, REQ-204]
    sources: []
    asis:
      packages: [com.legacy.claim]
      namespaces: [claim]
      discard: []                    # 어느 unit 도 쓰지 않아 폐기하는 AS-IS 프로그램·메서드(File.java#메서드) (근거는 레포트에)
    process:                         # 업무 프로세스 — unit 분할의 기준
      states: [접수, 심사완료, 보류, 지급완료]
      transitions:                   # '이전상태 -> 다음상태' (시작은 START). 전이 하나는 step unit 하나가 소유한다
        - "START -> 접수"
        - "접수 -> 심사완료"
        - "접수 -> 보류"
        - "심사완료 -> 지급완료"
    units:
      - id: core                     # 반드시 첫 unit. 여러 unit 이 함께 쓰는 엔티티·상태·서비스·SQL 을 클래스 통째로 먼저 변환
        kind: core                   # core | step(상태 전이 소유) | query(상태를 바꾸지 않는 조회)
        name: 청구 도메인 기반
        depends_on: []
        entities: [Claim]
        asis:
          programs: [ClaimService.java]   # 공유 클래스는 slice_units.py matrix 가 판정한다 (2개 이상 unit 사용 → core 필수)
      - id: intake
        kind: step
        name: 접수
        depends_on: [core]
        transitions: ["START -> 접수"]
        apis: ["POST /claims"]
        screens: [SCR-201 청구접수]
        requirements: [REQ-201]
        asis:
          programs: [ClaimReceiptAction.java]   # 진입점 프로그램. 이것만 쓰는 하위 클래스·statement 는 자동 배정
          # 진입점이 여러 unit 이 함께 쓰는 거대 컨트롤러 안의 메서드면 programs 대신 apis 경로로 자동 대응시키거나
          # (컨트롤러 @RequestMapping 과 대조) 경로가 없는 메서드만 methods: ["ClaimController#receive"] 로 적는다
      - id: review
        kind: step
        name: 심사
        depends_on: [intake]
        transitions: ["접수 -> 심사완료", "접수 -> 보류"]
        apis: ["POST /claims/{no}/review"]
        screens: [SCR-202 청구심사]
        requirements: [REQ-202]
        asis:
          programs: [ClaimReviewAction.java]
      - id: payment
        kind: step
        name: 지급
        depends_on: [review]
        transitions: ["심사완료 -> 지급완료"]
        apis: ["POST /claims/{no}/payment"]
        screens: [SCR-203 지급처리]
        requirements: [REQ-203]
        asis:
          programs: [ClaimPayAction.java]
      - id: inquiry
        kind: query
        name: 조회
        depends_on: [core]
        apis: ["GET /claims"]
        screens: [SCR-204 청구조회]
        requirements: [REQ-204]
        asis:
          programs: [ClaimQueryAction.java]
    flows:                           # unit 을 가로지르는 흐름(이음매) 테스트. 모든 step·query unit 이 한 번 이상 들어간다
      - id: FLOW-claim-01
        name: 접수부터 지급까지 정상 흐름
        units: [intake, review, payment]
        requirements: [REQ-201, REQ-202, REQ-203]
      - id: FLOW-claim-02
        name: 심사 보류 후 조회
        units: [intake, review, inquiry]

# (brownfield) 이전 차수에 이미 이관이 끝난 AS-IS 영역 ↔ TO-BE 경로. 없으면 빈 배열.
# 여기 적힌 AS-IS 프로그램·패키지·namespace 는 공통 사용 행렬에서 공통이 아니다(분류 pre_pipeline 로 집계만).
# 이번 차수 slice 가 이 코드를 부르면 TO-BE 에 이미 있는 것을 쓰는 것이고, 이 코드만 쓰는 공통 메서드는 공통이 되지 않는다.
pre_pipeline:
  - area: 회원 가입                  # 영역 이름 (차수 산출물·레포트에 쓰인다)
    module: user                     # (모듈이 있을 때) TO-BE 소유 모듈
    asis:
      packages: [com.legacy.join]
      programs: []
      namespaces: [join]
    tobe: [server/user/src/main/java/com/example/user/join]   # target_dir 기준 TO-BE 경로
    note: 1차 이관 완료              # 근거 (차수·산출물)

unassigned:                          # 어느 slice 에도 넣지 못한 항목 (사람 판단 필요)
  entities: []
  screens: []
  requirements: []
  asis:                              # 이번 차수 범위 외 AS-IS (컨트롤러·유형·배치·SQL 등). 공통 사용 행렬에서 공통이 아니다(out_of_scope)
    - program: NightBatchJob.java    # program(s)·package(s)·namespace(s) 중 하나 이상
      kind: batch                    # controller | type | batch | sql | screen | etc
      reason: 이번 차수 범위 외 (요구사항 범위표 근거)
  apis:                              # 이번 차수 범위 외 AS-IS API
    - api: "GET /legacy/report"
      reason: 이번 차수 범위 외

# traits — 이 slice 가 반드시 닫아야 하는 검증 축을 정한다 (tools/gate.py 의 coverage-axis 훅이 대조).
# 실측 근거: 파이프라인이 스스로 만든 결함은 전부 "앞 단계가 보지 못한 축" 에서만 잡혔다.
#
#   trait                  요구 축            왜 (실측)
#   file-upload            real-server        서블릿·파서가 서비스보다 먼저 갈린다 (multipart NUL 500, 413)
#   transaction            real-db            H2 로는 안 보이는 방언·캐스트 (Timestamp, H2 URL override)
#   batch                  real-db
#   counter                concurrency        조회수·시퀀스 (REQUIRES_NEW 커넥션 2중 점유 교착)
#   concurrency-sensitive  concurrency
#   rich-text              browser            jsdom 이 못 잡는 로드 즉시 크래시 (Tiptap)
#   dom-heavy              browser
#   auth                   real-server        필터·프록시 경로 (XFF 위조 허용)
#   proxy-header           real-server
#   external-io            real-server
#   sanitizer              security-static
#
# 모든 slice 는 기본으로 unit 축을 요구한다(그 위 축은 traits 가 요구할 때만). 매핑을 바꾸려면 config/project.yaml 의
# verification.trait_axes 에 덮어쓴다.
