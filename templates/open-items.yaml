# 확인 필요 항목(open item) 누적 파일. workspace/<project>/open-items.yaml 로 만들어진다.
# 직접 편집하지 말고 도구로 다룬다:
#   python tools/gate.py oi new --stage 2 --slice notice --kind unverified --severity high \
#     --summary "…" --evidence "파일:라인 또는 레포트#절" --target 5 [--owner integration-tester]
#   python tools/gate.py oi list [--status open] [--slice notice] [--target 5]
#   python tools/gate.py oi set OI-0003 converted --rr RR-0041
#   python tools/gate.py oi set OI-0004 accepted --approved-by 사용자 --expiry 2026-10-31 --note "…"
#
# RR 과의 구분: RR 은 "고쳐야 할 결함", open item 은 "아직 확인·결정되지 않은 것"이다.
#   kind: evidence_gap(근거 부족) | decision(사람 결정 필요) | unverified(검증 못 함)
#         | risk(위험 인지) | deferred(뒤 단계로 미룸)
#   status: open | resolved(확인됨) | converted(RR 로 전환, rr_id 필수)
#           | accepted(사람이 잔존 승인, approved_by·expiry 필수)

items:
  - id: OI-0001
    found_at: 2026-09-23 00:40        # KST
    stage: 2                          # 발견 단계
    slice: notice
    kind: unverified
    severity: high                    # blocker | high | medium | low
    summary: 삭제 첨부 연쇄가 notice 계약 문구와 어긋나는지 미확인
    evidence: reports/2609221900_stage2_notice-admin.md#8
    target_stage: 5                   # 이 항목을 닫을 단계
    owner: integration-tester
    rr_id: ''
    status: open
    approved_by: ''
    expiry: ''
    note: ''
