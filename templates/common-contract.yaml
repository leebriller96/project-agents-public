# 공통 계약 (common contract). workspace/<project>/contracts/common-contract.yaml
# 손으로 처음부터 쓰지 않는다: python tools/common_usage.py → python tools/common_contract.py init 이 초안을 만든다.
# 사람이 owner·decision 을 검토하고, 사람이 직접 승인한다: ! python tools/common_contract.py approve --by <이름>
# (에이전트가 approved 를 바꾸거나 approve 를 실행하면 훅이 막는다 — pipeline-core §16)
#
# 왜 필요한가: 업무 단위로 변환하면 각 업무 에이전트가 자기가 쓰는 공통 메서드만 보고 판단해, 공통 클래스를
# 부분 이관하거나 private 으로 복제했다. 공통만 따로 변환하면 업무 코드와 어긋났다. 공통은 여기서 한 번 확정하고
# common-porter 가 먼저 변환하며, 업무 slice 는 이 계약을 소비만 한다(복제·공통 영역 수정은 gate 가 차단).
