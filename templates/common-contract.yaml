# 규칙 요약
# - 한 업무만 쓰는 공통 메서드도 기본은 common. slice:<id> 로 내리는 것은 사람 결정(decided_by)이고,
#   다른 업무도 쓰면 validate 가 거부한다. 에이전트가 판단해 private 으로 옮기는 일은 없다.
# - 사용처 0 은 자동 폐기하지 않는다(review). 동적 호출·리플렉션 가능성을 사람이 확인한 뒤 discard.
# - 계약에 없는 공통이 필요하면 업무 slice 는 python tools/common_contract.py request 로 공통 요청(CR)을 남기고,
#   오케스트레이터가 common-porter 에 묶어 보낸다. 업무 slice 가 직접 만들지 않는다.
