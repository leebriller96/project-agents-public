# tools/ 회귀 테스트와 저장소 정합성 점검.
# Windows 를 함께 도는 이유: 파일 잠금·원자적 교체(os.replace)·콘솔 인코딩(cp949)이 OS 마다 다르게 동작한다.
name: tools-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 의존성 설치
        run: python -m pip install -r tools/requirements.txt pytest pyflakes
      - name: 정적 검사 (미사용 import·정의되지 않은 이름)
        run: python -m pyflakes tools tests
      - name: 회귀 테스트
        run: python -m pytest -q
      - name: 저장소 정합성 (문서 ↔ 파일)
        run: python tools/selfcheck.py
      - name: 커밋 금지 대상(workspace·실제 설정) 없음
        shell: bash
        run: |
          if git ls-files | grep -E '^workspace/|^config/project\.yaml$'; then
            echo "커밋하면 안 되는 파일이 있다"; exit 1
          fi
